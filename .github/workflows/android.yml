name: Android tests

on:
  push:
    branches: [main]
    paths: ['flows/**', 'subflows/**', 'scripts/**', '.github/workflows/android.yml']
  pull_request:
  workflow_dispatch:
    inputs:
      tags:
        description: 'Only run flows with this tag (smoke, regression, cart, login, checkout). Empty runs everything.'
        required: false
        default: ''

permissions:
  contents: read

# a newer push replaces a run that is still going
concurrency:
  group: android-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Enable hardware acceleration for the emulator (KVM)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Free disk space (the emulator needs several GB for its data partition)
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
      - name: Download the app and install Maestro
        run: |
          bash scripts/download-app.sh android
          bash scripts/install-maestro.sh
      - name: Run the flows on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          TAGS: ${{ github.event.inputs.tags }}
        with:
          api-level: 30
          target: aosp_atd
          arch: x86_64
          profile: pixel_6
          disk-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash scripts/run-tests.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-reports
          path: reports
          if-no-files-found: ignore
