name: Explore the app

# Walks through the app on an Android emulator and saves a screenshot and the UI tree of every screen, so the test flows can be written
# from facts. Run by hand when the app under test changes.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  explore:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Enable hardware acceleration for the emulator (KVM)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Download the app and install Maestro
        run: |
          bash scripts/download-app.sh android
          bash scripts/install-maestro.sh
      - name: Walk through the app on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash scripts/explore.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: app-screens
          path: artifacts
          if-no-files-found: ignore
