name: Flakiness check

# Runs the same flows many times on a fresh emulator and reports each test's pass rate, so "is this suite reliable?" has a number.
on:
  workflow_dispatch:
    inputs:
      runs:
        description: 'How many times to repeat the flows'
        required: true
        default: '8'
      tags:
        description: 'Which flows to repeat (a tag: smoke, regression, cart, login, checkout)'
        required: true
        default: 'smoke'

permissions:
  contents: read

jobs:
  flakiness:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Enable hardware acceleration for the emulator (KVM)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Free disk space (the emulator needs several GB for its data partition)
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
      - name: Download the app and install Maestro
        run: |
          bash scripts/download-app.sh android
          bash scripts/install-maestro.sh
      - name: Repeat the flows on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          RUNS: ${{ github.event.inputs.runs }}
          TAGS: ${{ github.event.inputs.tags }}
        with:
          api-level: 30
          target: aosp_atd
          arch: x86_64
          profile: pixel_6
          disk-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash scripts/flakiness.sh
      - name: Summarise
        if: always()
        run: |
          node scripts/summarize-flakiness.js | tee reports/flakiness.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: flakiness-reports
          path: reports
          if-no-files-found: ignore
