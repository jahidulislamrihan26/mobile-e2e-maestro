appId: com.saucelabs.mydemoapp.rn
name: "TC-010 Payment step rejects an invalid card number"
tags:
  - regression
  - checkout
---
- runFlow: ../subflows/start-app.yaml
- runFlow:
    file: ../subflows/add-to-cart.yaml
    env:
      PRODUCT: "Sauce Labs Backpack"
- tapOn: "cart badge"
- runFlow: ../subflows/checkout-to-address.yaml
- runFlow: ../subflows/fill-address.yaml
- scrollUntilVisible:
    element: "To Payment.*"
- tapOn: "To Payment.*"
- assertVisible: "Enter a payment method"
# 4111 1111 1111 1112 fails the card checksum
- runFlow:
    file: ../subflows/fill-payment.yaml
    env:
      CARD_NUMBER: "4111111111111112"
      EXPIRY: "1230"
      CVV: "123"
- scrollUntilVisible:
    element: "Review Order.*"
- tapOn: "Review Order.*"
# still on the payment step
- assertVisible: "Enter a payment method"
- assertNotVisible: "Review your order"
